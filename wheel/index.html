<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff0f6">
  <title>Колесо пригод</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 class="title">Колесо пригод</h1>

    <div class="wheel-box">
      <div class="wheel-frame">
        <svg class="wheel" id="wheel" viewBox="0 0 300 300" aria-hidden="true"></svg>
      </div>
      <div class="pointer" aria-hidden="true"></div>
    </div>

    <button class="spin-btn" id="spinBtn" type="button">Запусти колесо!</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <div class="overlay" id="overlay" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupText">
      <div class="popup-emoji" id="popupEmoji"></div>
      <p class="popup-text" id="popupText"></p>
      <button class="again-btn" id="againBtn" type="button">Крутити ще</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
